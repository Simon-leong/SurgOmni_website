<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E8A80"/>
      <stop offset="1" stop-color="#3E5FA0"/>
    </linearGradient>
    <linearGradient id="clean" x1="256" y1="120" x2="392" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FBFF"/>
      <stop offset="1" stop-color="#BFE3F5"/>
    </linearGradient>
    <linearGradient id="haze" x1="120" y1="256" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8DA2B4"/>
      <stop offset="1" stop-color="#5C7488"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="136"/></clipPath>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="6" y="6" width="500" height="500" rx="116" fill="url(#bg)"/>

  <!-- endoscope aperture: before/after split inside the lens -->
  <g clip-path="url(#disc)">
    <rect x="120" y="120" width="272" height="272" fill="url(#haze)"/>
    <polygon points="120,120 392,120 392,392" fill="url(#clean)"/>
    <!-- soft smoke/haze strokes on the degraded side -->
    <path d="M150 300 q30 -26 62 0 t62 0" fill="none" stroke="#EAF1F6" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
    <path d="M150 340 q30 -26 62 0 t62 0" fill="none" stroke="#EAF1F6" stroke-width="10" stroke-linecap="round" opacity="0.30"/>
    <!-- crisp before/after divider -->
    <line x1="120" y1="120" x2="392" y2="392" stroke="#FFFFFF" stroke-width="7" opacity="0.9"/>
    <!-- restoration sparkle on the clean side (deep tone for contrast on the light half) -->
    <path d="M312 147 L320 196 L370 205 L320 214 L312 263 L304 214 L254 205 L304 196 Z" fill="#1C3E5B"/>
  </g>

  <!-- lens ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-width="26"/>
</svg>
